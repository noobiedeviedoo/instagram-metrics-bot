<svg width="680" height="790" viewBox="0 0 680 790" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Esquema del bot de metricas de Instagram y del analisis semanal por audio</title>
<style>
text{font-family:Helvetica,Arial,sans-serif;}
.th{font-size:14px;font-weight:600;}
.ts{font-size:12px;font-weight:400;}
.lbl{font-size:12px;font-weight:400;fill:#444441;}
.note{font-size:11px;font-style:italic;fill:#5F5E5A;}
.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:1;}
.c-purple-t{fill:#3C3489;}
.c-purple-s{fill:#534AB7;}
.c-coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1;}
.c-coral-t{fill:#712B13;}
.c-coral-s{fill:#993C1D;}
.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1;}
.c-teal-t{fill:#085041;}
.c-teal-s{fill:#0F6E56;}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none;}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="790" fill="#FFFFFF"/>

<rect x="40" y="20" width="10" height="10" rx="2" fill="#7F77DD"/>
<text class="ts lbl" x="58" y="29">Script (bot)</text>
<rect x="156" y="20" width="10" height="10" rx="2" fill="#D85A30"/>
<text class="ts lbl" x="174" y="29">Fichero / credencial</text>
<rect x="330" y="20" width="10" height="10" rx="2" fill="#1D9E75"/>
<text class="ts lbl" x="348" y="29">Infraestructura externa</text>

<!-- contenedor: un solo run de fetch-metrics.yml -->
<rect x="20" y="140" width="640" height="310" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
<text class="ts lbl" x="35" y="158">fetch-metrics.yml · GitHub Actions · lunes 07:00 UTC (un mismo run)</text>

<!-- flechas -->
<line x1="185" y1="120" x2="300" y2="170" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="120" x2="380" y2="170" class="arr" marker-end="url(#arrow)"/>
<line x1="300" y1="225" x2="190" y2="255" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="225" x2="490" y2="255" class="arr" marker-end="url(#arrow)"/>
<line x1="190" y1="305" x2="280" y2="375" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="305" x2="400" y2="375" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="360" x2="340" y2="375" class="arr" marker-end="url(#arrow)"/>
<line x1="300" y1="430" x2="190" y2="470" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="430" x2="490" y2="470" class="arr" marker-end="url(#arrow)"/>
<line x1="190" y1="520" x2="290" y2="615" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="520" x2="410" y2="615" class="arr" marker-end="url(#arrow)"/>
<line x1="185" y1="580" x2="300" y2="615" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="580" x2="380" y2="615" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="670" x2="340" y2="700" class="arr" marker-end="url(#arrow)"/>

<!-- credenciales Meta -->
<rect class="c-coral" x="40" y="70" width="290" height="50" rx="4"/>
<text class="th c-coral-t" x="185" y="92" text-anchor="middle">IG_ACCESS_TOKEN</text>
<text class="ts c-coral-s" x="185" y="108" text-anchor="middle">token con permiso de insights</text>

<rect class="c-coral" x="350" y="70" width="290" height="50" rx="4"/>
<text class="th c-coral-t" x="495" y="92" text-anchor="middle">IG_BUSINESS_ACCOUNT_ID</text>
<text class="ts c-coral-s" x="495" y="108" text-anchor="middle">17841441636956500</text>

<!-- paso 1: fetch_metrics.py -->
<rect class="c-purple" x="190" y="170" width="300" height="55" rx="4"/>
<text class="th c-purple-t" x="340" y="192" text-anchor="middle">fetch_metrics.py</text>
<text class="ts c-purple-s" x="340" y="210" text-anchor="middle">pide insights a graph.instagram.com</text>

<!-- csv -->
<rect class="c-coral" x="60" y="255" width="260" height="50" rx="4"/>
<text class="th c-coral-t" x="190" y="277" text-anchor="middle">account_metrics.csv</text>
<text class="ts c-coral-s" x="190" y="293" text-anchor="middle">metricas de cuenta, por semana</text>

<rect class="c-coral" x="360" y="255" width="260" height="50" rx="4"/>
<text class="th c-coral-t" x="490" y="277" text-anchor="middle">media_metrics.csv</text>
<text class="ts c-coral-s" x="490" y="293" text-anchor="middle">metricas por publicacion</text>

<!-- credencial anthropic -->
<rect class="c-coral" x="240" y="320" width="200" height="40" rx="4"/>
<text class="th c-coral-t" x="340" y="338" text-anchor="middle">ANTHROPIC_API_KEY</text>
<text class="ts c-coral-s" x="340" y="352" text-anchor="middle">console.anthropic.com</text>

<!-- paso 2: analyze_metrics.py -->
<rect class="c-purple" x="190" y="375" width="300" height="55" rx="4"/>
<text class="th c-purple-t" x="340" y="397" text-anchor="middle">analyze_metrics.py</text>
<text class="ts c-purple-s" x="340" y="415" text-anchor="middle">lee los CSV, llama a la API de Claude</text>

<!-- fila 5: analisis -->
<rect class="c-coral" x="60" y="470" width="260" height="50" rx="4"/>
<text class="th c-coral-t" x="190" y="492" text-anchor="middle">weekly_analysis.txt</text>
<text class="ts c-coral-s" x="190" y="508" text-anchor="middle">analisis en espanol, para TTS</text>

<rect class="c-coral" x="360" y="470" width="260" height="50" rx="4"/>
<text class="th c-coral-t" x="490" y="492" text-anchor="middle">.last_sent_analysis_hash</text>
<text class="ts c-coral-s" x="490" y="508" text-anchor="middle">evita mandar el audio 2 veces</text>

<!-- fila 6: credenciales telegram -->
<rect class="c-coral" x="40" y="535" width="290" height="45" rx="4"/>
<text class="th c-coral-t" x="185" y="555" text-anchor="middle">TELEGRAM_BOT_TOKEN</text>
<text class="ts c-coral-s" x="185" y="570" text-anchor="middle">bot tts-telegram-bot</text>

<rect class="c-coral" x="350" y="535" width="290" height="45" rx="4"/>
<text class="th c-coral-t" x="495" y="555" text-anchor="middle">TELEGRAM_CHAT_ID</text>
<text class="ts c-coral-s" x="495" y="570" text-anchor="middle">chat de Miguel</text>

<!-- fila 7: bot 2 -->
<rect class="c-purple" x="180" y="615" width="320" height="55" rx="4"/>
<text class="th c-purple-t" x="340" y="637" text-anchor="middle">send_weekly_audio.py</text>
<text class="ts c-purple-s" x="340" y="655" text-anchor="middle">speak-analysis.yml · Actions · lunes 10:00 UTC</text>

<text class="note" x="340" y="688" text-anchor="middle">(genera el audio con edge-tts; solo lo manda si el texto cambió desde el último envío)</text>

<!-- fila 8: telegram -->
<rect class="c-teal" x="240" y="700" width="200" height="50" rx="4"/>
<text class="th c-teal-t" x="340" y="722" text-anchor="middle">Telegram</text>
<text class="ts c-teal-s" x="340" y="738" text-anchor="middle">audio en tu chat</text>

</svg>
