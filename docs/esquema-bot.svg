<svg width="680" height="720" viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Esquema del bot de metricas de Instagram y del analisis semanal por audio</title>
<style>
text{font-family:Helvetica,Arial,sans-serif;}
.th{font-size:14px;font-weight:600;}
.ts{font-size:12px;font-weight:400;}
.lbl{font-size:12px;font-weight:400;fill:#444441;}
.note{font-size:11px;font-style:italic;fill:#5F5E5A;}
.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:1;}
.c-purple-t{fill:#3C3489;}
.c-purple-s{fill:#534AB7;}
.c-coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1;}
.c-coral-t{fill:#712B13;}
.c-coral-s{fill:#993C1D;}
.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1;}
.c-teal-t{fill:#085041;}
.c-teal-s{fill:#0F6E56;}
.c-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1;}
.c-gray-t{fill:#444441;}
.c-gray-s{fill:#5F5E5A;}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none;}
.leader{stroke:#888780;stroke-width:1;stroke-dasharray:4 3;fill:none;}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="720" fill="#FFFFFF"/>

<rect x="40" y="20" width="10" height="10" rx="2" fill="#7F77DD"/>
<text class="ts lbl" x="58" y="29">Script (bot)</text>
<rect x="156" y="20" width="10" height="10" rx="2" fill="#D85A30"/>
<text class="ts lbl" x="174" y="29">Fichero / credencial</text>
<rect x="330" y="20" width="10" height="10" rx="2" fill="#1D9E75"/>
<text class="ts lbl" x="348" y="29">Infraestructura externa</text>

<!-- flechas -->
<line x1="185" y1="120" x2="300" y2="150" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="120" x2="380" y2="150" class="arr" marker-end="url(#arrow)"/>
<line x1="300" y1="205" x2="190" y2="235" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="205" x2="490" y2="235" class="arr" marker-end="url(#arrow)"/>
<line x1="190" y1="285" x2="300" y2="320" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="285" x2="380" y2="320" class="arr" marker-end="url(#arrow)"/>
<line x1="300" y1="375" x2="190" y2="405" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="375" x2="490" y2="405" class="arr" marker-end="url(#arrow)"/>
<line x1="190" y1="455" x2="290" y2="550" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="455" x2="410" y2="550" class="arr" marker-end="url(#arrow)"/>
<line x1="185" y1="515" x2="300" y2="550" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="515" x2="380" y2="550" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="605" x2="340" y2="635" class="arr" marker-end="url(#arrow)"/>

<!-- fila 1: credenciales de Meta -->
<rect class="c-coral" x="40" y="70" width="290" height="50" rx="4"/>
<text class="th c-coral-t" x="185" y="92" text-anchor="middle">IG_ACCESS_TOKEN</text>
<text class="ts c-coral-s" x="185" y="108" text-anchor="middle">token con permiso de insights</text>

<rect class="c-coral" x="350" y="70" width="290" height="50" rx="4"/>
<text class="th c-coral-t" x="495" y="92" text-anchor="middle">IG_BUSINESS_ACCOUNT_ID</text>
<text class="ts c-coral-s" x="495" y="108" text-anchor="middle">17841441636956500</text>

<!-- fila 2: bot 1 -->
<rect class="c-purple" x="190" y="150" width="300" height="55" rx="4"/>
<text class="th c-purple-t" x="340" y="172" text-anchor="middle">fetch_metrics.py</text>
<text class="ts c-purple-s" x="340" y="190" text-anchor="middle">fetch-metrics.yml · Actions · lunes 07:00 UTC</text>

<!-- fila 3: CSV -->
<text class="ts lbl" x="340" y="228" text-anchor="middle">— en el repo GitHub instagram-metrics-bot —</text>
<rect class="c-coral" x="60" y="235" width="260" height="50" rx="4"/>
<text class="th c-coral-t" x="190" y="257" text-anchor="middle">account_metrics.csv</text>
<text class="ts c-coral-s" x="190" y="273" text-anchor="middle">metricas de cuenta, por semana</text>

<rect class="c-coral" x="360" y="235" width="260" height="50" rx="4"/>
<text class="th c-coral-t" x="490" y="257" text-anchor="middle">media_metrics.csv</text>
<text class="ts c-coral-s" x="490" y="273" text-anchor="middle">metricas por publicacion</text>

<!-- fila 4: Claude -->
<rect class="c-purple" x="170" y="320" width="340" height="55" rx="4"/>
<text class="th c-purple-t" x="340" y="342" text-anchor="middle">Claude — tarea semanal (Cowork)</text>
<text class="ts c-purple-s" x="340" y="360" text-anchor="middle">git pull, lee los CSV, analiza, escribe el texto, git push</text>

<!-- fila 5: analisis -->
<rect class="c-coral" x="60" y="405" width="260" height="50" rx="4"/>
<text class="th c-coral-t" x="190" y="427" text-anchor="middle">weekly_analysis.txt</text>
<text class="ts c-coral-s" x="190" y="443" text-anchor="middle">analisis en espanol, para TTS</text>

<rect class="c-coral" x="360" y="405" width="260" height="50" rx="4"/>
<text class="th c-coral-t" x="490" y="427" text-anchor="middle">.last_sent_analysis_hash</text>
<text class="ts c-coral-s" x="490" y="443" text-anchor="middle">evita mandar el audio 2 veces</text>

<!-- fila 6: credenciales telegram -->
<rect class="c-coral" x="40" y="470" width="290" height="45" rx="4"/>
<text class="th c-coral-t" x="185" y="490" text-anchor="middle">TELEGRAM_BOT_TOKEN</text>
<text class="ts c-coral-s" x="185" y="505" text-anchor="middle">bot tts-telegram-bot</text>

<rect class="c-coral" x="350" y="470" width="290" height="45" rx="4"/>
<text class="th c-coral-t" x="495" y="490" text-anchor="middle">TELEGRAM_CHAT_ID</text>
<text class="ts c-coral-s" x="495" y="505" text-anchor="middle">chat de Miguel</text>

<!-- fila 7: bot 2 -->
<rect class="c-purple" x="180" y="550" width="320" height="55" rx="4"/>
<text class="th c-purple-t" x="340" y="572" text-anchor="middle">send_weekly_audio.py</text>
<text class="ts c-purple-s" x="340" y="590" text-anchor="middle">speak-analysis.yml · Actions · lunes 10:00 UTC</text>

<text class="note" x="340" y="622" text-anchor="middle">(genera el audio con edge-tts; solo lo manda si el texto cambió desde el último envío)</text>

<!-- fila 8: telegram -->
<rect class="c-teal" x="240" y="635" width="200" height="50" rx="4"/>
<text class="th c-teal-t" x="340" y="657" text-anchor="middle">Telegram</text>
<text class="ts c-teal-s" x="340" y="673" text-anchor="middle">audio en tu chat</text>

</svg>
