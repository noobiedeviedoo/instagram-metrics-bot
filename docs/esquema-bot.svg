<svg width="700" height="960" viewBox="0 0 700 960" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Esquema del bot de metricas de Instagram: fetch diario y analisis/envio semanal</title>
<style>
text{font-family:Helvetica,Arial,sans-serif;}
.th{font-size:14px;font-weight:600;}
.ts{font-size:12px;font-weight:400;}
.lbl{font-size:12px;font-weight:400;fill:#444441;}
.note{font-size:11px;font-style:italic;fill:#5F5E5A;}
.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:1;}
.c-purple-t{fill:#3C3489;}
.c-purple-s{fill:#534AB7;}
.c-coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1;}
.c-coral-t{fill:#712B13;}
.c-coral-s{fill:#993C1D;}
.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1;}
.c-teal-t{fill:#085041;}
.c-teal-s{fill:#0F6E56;}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none;}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="700" height="960" fill="#FFFFFF"/>

<rect x="40" y="20" width="10" height="10" rx="2" fill="#7F77DD"/>
<text class="ts lbl" x="58" y="29">Script (bot)</text>
<rect x="176" y="20" width="10" height="10" rx="2" fill="#D85A30"/>
<text class="ts lbl" x="194" y="29">Fichero / credencial</text>
<rect x="350" y="20" width="10" height="10" rx="2" fill="#1D9E75"/>
<text class="ts lbl" x="368" y="29">Infraestructura externa</text>

<!-- credenciales Meta (usadas por fetch_metrics.py) -->
<rect class="c-coral" x="40" y="60" width="290" height="50" rx="4"/>
<text class="th c-coral-t" x="185" y="82" text-anchor="middle">IG_ACCESS_TOKEN</text>
<text class="ts c-coral-s" x="185" y="98" text-anchor="middle">token con permiso de insights</text>

<rect class="c-coral" x="350" y="60" width="290" height="50" rx="4"/>
<text class="th c-coral-t" x="495" y="82" text-anchor="middle">IG_BUSINESS_ACCOUNT_ID</text>
<text class="ts c-coral-s" x="495" y="98" text-anchor="middle">17841441636956500</text>

<!-- contenedor 1: fetch diario -->
<rect x="20" y="130" width="660" height="200" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
<text class="ts lbl" x="35" y="148">fetch-metrics.yml · GitHub Actions · diario 03:00 UTC (workflow_dispatch disponible)</text>

<rect class="c-purple" x="200" y="160" width="300" height="55" rx="4"/>
<text class="th c-purple-t" x="350" y="182" text-anchor="middle">fetch_metrics.py</text>
<text class="ts c-purple-s" x="350" y="200" text-anchor="middle">pide insights a graph.instagram.com</text>

<rect class="c-coral" x="60" y="250" width="270" height="55" rx="4"/>
<text class="th c-coral-t" x="195" y="272" text-anchor="middle">account_metrics.csv</text>
<text class="ts c-coral-s" x="195" y="288" text-anchor="middle">metricas de cuenta, un snapshot al dia</text>

<rect class="c-coral" x="370" y="250" width="270" height="55" rx="4"/>
<text class="th c-coral-t" x="505" y="272" text-anchor="middle">media_metrics.csv</text>
<text class="ts c-coral-s" x="505" y="288" text-anchor="middle">ultimas 5 publicaciones, cada dia</text>

<!-- flechas contenedor 1 -->
<line x1="185" y1="110" x2="290" y2="160" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="110" x2="400" y2="160" class="arr" marker-end="url(#arrow)"/>
<line x1="290" y1="215" x2="195" y2="250" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="215" x2="505" y2="250" class="arr" marker-end="url(#arrow)"/>

<!-- credencial anthropic (usada por analyze_metrics.py, ya dentro del contenedor 2) -->
<rect class="c-coral" x="250" y="352" width="200" height="42" rx="4"/>
<text class="th c-coral-t" x="350" y="370" text-anchor="middle">ANTHROPIC_API_KEY</text>
<text class="ts c-coral-s" x="350" y="386" text-anchor="middle">console.anthropic.com</text>

<!-- contenedor 2: analisis + envio semanal -->
<rect x="20" y="415" width="660" height="500" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
<text class="ts lbl" x="35" y="433">speak-analysis.yml · GitHub Actions · lunes 06:00 UTC (lee los CSV que dejo el fetch diario)</text>

<line x1="350" y1="394" x2="350" y2="445" class="arr" marker-end="url(#arrow)"/>

<rect class="c-purple" x="200" y="445" width="300" height="55" rx="4"/>
<text class="th c-purple-t" x="350" y="467" text-anchor="middle">analyze_metrics.py</text>
<text class="ts c-purple-s" x="350" y="485" text-anchor="middle">lee 28 dias de CSV, llama a la API de Claude</text>

<rect class="c-coral" x="200" y="525" width="300" height="50" rx="4"/>
<text class="th c-coral-t" x="350" y="547" text-anchor="middle">weekly_analysis.txt</text>
<text class="ts c-coral-s" x="350" y="563" text-anchor="middle">analisis en espanol, para TTS</text>

<line x1="350" y1="500" x2="350" y2="525" class="arr" marker-end="url(#arrow)"/>

<!-- credenciales telegram -->
<rect class="c-coral" x="40" y="600" width="290" height="45" rx="4"/>
<text class="th c-coral-t" x="185" y="620" text-anchor="middle">TELEGRAM_BOT_TOKEN</text>
<text class="ts c-coral-s" x="185" y="635" text-anchor="middle">bot tts-telegram-bot</text>

<rect class="c-coral" x="370" y="600" width="290" height="45" rx="4"/>
<text class="th c-coral-t" x="515" y="620" text-anchor="middle">TELEGRAM_CHAT_ID</text>
<text class="ts c-coral-s" x="515" y="635" text-anchor="middle">chat de Miguel</text>

<!-- send_weekly_audio.py y send_weekly_chart.py, en paralelo -->
<rect class="c-purple" x="55" y="672" width="270" height="60" rx="4"/>
<text class="th c-purple-t" x="190" y="695" text-anchor="middle">send_weekly_audio.py</text>
<text class="ts c-purple-s" x="190" y="712" text-anchor="middle">edge-tts + manda texto y audio</text>

<rect class="c-purple" x="375" y="672" width="270" height="60" rx="4"/>
<text class="th c-purple-t" x="510" y="695" text-anchor="middle">send_weekly_chart.py</text>
<text class="ts c-purple-s" x="510" y="712" text-anchor="middle">matplotlib: lee los CSV directamente</text>

<text class="note" x="350" y="655" text-anchor="middle">(el grafico no pasa por weekly_analysis.txt ni por la IA — solo por los CSV)</text>

<!-- flechas hacia audio/chart -->
<line x1="235" y1="575" x2="180" y2="672" class="arr" marker-end="url(#arrow)"/>
<line x1="185" y1="645" x2="185" y2="672" class="arr" marker-end="url(#arrow)"/>
<line x1="515" y1="645" x2="515" y2="672" class="arr" marker-end="url(#arrow)"/>

<!-- hashes anti-duplicado -->
<rect class="c-coral" x="55" y="756" width="270" height="42" rx="4"/>
<text class="th c-coral-t" x="190" y="774" text-anchor="middle">.last_sent_analysis_hash</text>
<text class="ts c-coral-s" x="190" y="789" text-anchor="middle">evita mandar el audio 2 veces</text>

<rect class="c-coral" x="375" y="756" width="270" height="42" rx="4"/>
<text class="th c-coral-t" x="510" y="774" text-anchor="middle">.last_sent_chart_hash</text>
<text class="ts c-coral-s" x="510" y="789" text-anchor="middle">evita mandar el grafico 2 veces</text>

<line x1="190" y1="732" x2="190" y2="756" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="732" x2="510" y2="756" class="arr" marker-end="url(#arrow)"/>

<!-- telegram -->
<rect class="c-teal" x="250" y="840" width="200" height="55" rx="4"/>
<text class="th c-teal-t" x="350" y="863" text-anchor="middle">Telegram</text>
<text class="ts c-teal-s" x="350" y="880" text-anchor="middle">texto + audio + grafico en tu chat</text>

<line x1="220" y1="798" x2="310" y2="840" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="798" x2="390" y2="840" class="arr" marker-end="url(#arrow)"/>

</svg>
