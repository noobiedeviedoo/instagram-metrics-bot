name: Recoger metricas de Instagram (programado)

on:
  schedule:
    # Todos los lunes a las 03:00 UTC (04:00 en Espana en invierno, 05:00 en
    # verano). Adelantado para dejar margen antes de speak-analysis.yml
    # (06:00 UTC), que manda el mensaje de Telegram a las 08:00 hora local.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar recogida de metricas
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: python scripts/fetch_metrics.py

      - name: Analizar los datos con la API de Claude
        # continue-on-error: si esto falla (p.ej. la API de Anthropic caida,
        # o problemas con la key) no debe bloquear el commit de los CSV, que
        # es la parte mas importante. El paso queda marcado como fallido en
        # el log de todas formas, para que se note.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/analyze_metrics.py

      - name: Commit y push de los CSV y el analisis actualizados
        run: |
          git config user.name "instagram-metrics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add account_metrics.csv media_metrics.csv weekly_analysis.txt
          if ! git diff --cached --quiet; then
            git commit -m "Metricas y analisis: actualizacion automatica"
            if ! git push; then
              echo "Push rechazado, sincronizando con git pull..."
              git pull --no-edit --no-rebase
              git push
            fi
          else
            echo "Sin cambios que commitear."
          fi
